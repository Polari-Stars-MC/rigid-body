[workspace]
members = [
    "crates/mps-formula",
    "crates/mps-core",
    "crates/mps-cosmos",
    "crates/mps-jni",
    "crates/mps-ffm",
    "crates/mps-test",
    "crates/mps-web",
    "crates/mps-build-common",
    "crates/mps-bindgen-macro",
    "crates/xtask"
]
# The vendored `rapier/` folder is its own Cargo workspace (the user's local
# rapier3d-f64 checkout). Exclude it so it isn't absorbed into this workspace;
# `rapier3d-f64` is pulled in via a path dependency in [workspace.dependencies]
# and keeps resolving its own `[workspace.package]` / `[workspace.dependencies]`.
exclude = ["rapier", "docs"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"

[workspace.dependencies]
rapier3d = { package = "rapier3d-f64", path = "rapier/crates/rapier3d-f64", features = ["parallel"] }
ljni = { version = "0.21.0", package = "jni" }
parking_lot = "0.12.5"
hashbrown = "0.17.1"
smallvec = "1.15.2"
rayon = "1.12"
anvilkit = { version = "0.1", features = ["rapier"] }
bevy_ecs = { version = "0.14" }
dashmap = "7.0.0-rc2"
wide = "1.6"

# Profile settings only take effect at the workspace root.
[profile.dev]
panic = "unwind"

[profile.release]
# Must stay "unwind": mps-core/mps-jni are cdylibs hosted inside a JVM, and
# every FFI/JNI entry point relies on `catch_unwind` (ffi_guard) to convert
# panics into error codes. With `panic = "abort"` catch_unwind cannot catch,
# so any panic would kill the host process.
panic = "unwind"
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
debug = 0

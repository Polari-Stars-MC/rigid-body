# ci.yml — mps_rigid_body 主 CI 流水线
#
# 触发条件:
#   - push 到 main 分支
#   - 任意 PR 到 main 分支
#   - 手动触发 (workflow_dispatch)
#
# 作业:
#   1. rust  — cargo fmt, clippy, test, build --release (纯 Rust)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:

  # ==========================================================================
  # Rust: fmt + clippy + test + build --release
  # ==========================================================================

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      # 只检查主 workspace 的 10 个 crate。vendored rapier/ 虽被根 Cargo.toml
      # exclude，但新版 rustfmt 会顺着 path 依赖把 rapier/parry 也卷进 --all，
      # 而 fork 的格式基线由其自身 rustfmt.toml 锚定（ADR-0008 补丁纪律：
      # fork 内文件不做服务上层的格式翻新）。逐包 -p 显式圈定范围。
      - name: Check formatting
        run: >
          cargo fmt --check
          -p mps-formula -p mps-core -p mps-cosmos -p mps-jni -p mps-ffm
          -p mps-test -p mps-web -p mps-build-common -p mps-bindgen-macro
          -p xtask

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

      # cbindgen is pinned in Cargo.lock, so both generated headers must be reproducible.
      # Skip on Windows: git autocrlf could report spurious line-ending diffs.
      - name: Check generated C headers are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          git diff --exit-code -- crates/mps-core/include/rigid_body.h crates/mps-cosmos/include/cosmos.h

      # The generated headers must be self-contained C: they are the contract for
      # any C/FFM consumer, so a header that references undefined types is broken
      # even if byte-reproducible. Syntax-check both with a real C compiler.
      - name: Syntax-check generated C headers (self-contained)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo '#include "crates/mps-core/include/rigid_body.h"' > /tmp/hdr_core.c
          echo 'int main(void) { return 0; }' >> /tmp/hdr_core.c
          echo '#include "crates/mps-cosmos/include/cosmos.h"' > /tmp/hdr_cosmos.c
          echo 'int main(void) { return 0; }' >> /tmp/hdr_cosmos.c
          gcc -fsyntax-only -std=c11 -Wall /tmp/hdr_core.c
          gcc -fsyntax-only -std=c11 -Wall /tmp/hdr_cosmos.c

      # `crates/mps-web/src/metrics.rs` carries 18 constants consumed by the docs
      # site. The in-repo guard (`verify_metrics_sync`) only recomputes 3 of them,
      # so anything else could drift unnoticed. Regenerating and diffing is the
      # authoritative check: it covers every constant and cannot drift from the
      # generator, because it *is* the generator.
      - name: Check generated metrics are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -p xtask -- dump-metrics
          git diff --exit-code -- crates/mps-web/src/metrics.rs

  # ==========================================================================
  # Web audit: i18n key parity, anchor integrity, stat-num hygiene
  # ==========================================================================

  web-audit:
    name: Web doc audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run web audit
        run: python3 crates/mps-web/scripts/web_audit.py

  # ==========================================================================
  # Java JNI smoke: load the real cdylib from a JVM and exercise the ABI.
  #
  # Rust 侧守门（cargo test）盖不到两件事：① cdylib 导出表里真的有这些
  # `Java_org_polaris2023_mps_*` 符号；② 真实 JVM System.load 能解析依赖
  # 并成功链接。三个 fixture 分别覆盖 rapier 主面、cosmos 浮动原点、
  # debug-recording 录制契约；mpsun 工具类统一加载 + 找库文件。
  # ==========================================================================

  jni-smoke:
    name: Java JNI smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up JDK 21 (FFM-ready)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build cdylib
        run: cargo build --release -p mps-jni

      - name: Compile smoke fixtures
        run: |
          mkdir -p target/jni-smoke-classes
          javac -d target/jni-smoke-classes \
            crates/mps-test/java/collision-mode/org/polaris2023/mps/rapier/RapierNative.java \
            crates/mps-test/java/cosmos-floating-origin/org/polaris2023/mps/cosmos/CosmosNative.java \
            crates/mps-test/java/debug-recording/org/polaris2023/mps/rapier/RecordingNative.java \
            crates/mps-test/java/baker-cache/org/polaris2023/mps/rapier/BakerNative.java \
            crates/mps-test/java/recording-events/org/polaris2023/mps/rapier/EventsNative.java

      - name: Run smoke fixtures
        run: |
          LIB=$(ls target/release/libmps_rigid_body.so)
          java -cp target/jni-smoke-classes \
            -Djava.library.path=$(dirname "$LIB") \
            org.polaris2023.mps.rapier.RapierNative "$LIB"
          java -cp target/jni-smoke-classes \
            -Djava.library.path=$(dirname "$LIB") \
            org.polaris2023.mps.cosmos.CosmosNative "$LIB"
          java -cp target/jni-smoke-classes \
            -Djava.library.path=$(dirname "$LIB") \
            org.polaris2023.mps.rapier.RecordingNative "$LIB"
          java -cp target/jni-smoke-classes \
            -Djava.library.path=$(dirname "$LIB") \
            org.polaris2023.mps.rapier.BakerNative "$LIB"
          java -cp target/jni-smoke-classes \
            -Djava.library.path=$(dirname "$LIB") \
            org.polaris2023.mps.rapier.EventsNative "$LIB"
